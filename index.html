<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세계사 인터랙티브 타임라인</title>
<style>
:root{--bg:#07090d;--card:#131820;--card2:#1b222d;--tx:#eef0f3;--mu:#8f98a6;--gold:#d8b45a;--blue:#5fa8ff;--ok:#4fd18b;--no:#ff6b6b;--ln:#2a3340;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.sans,nav,button,.chip,.tag{font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);background:#07090dee;z-index:5}
nav button{padding:10px 14px;border-radius:8px;white-space:nowrap;color:var(--mu);min-height:44px}
nav button.on{color:var(--gold);background:var(--card)}
.view{display:none;padding:20px 16px 60px;max-width:1200px;margin:auto}.view.on{display:block}
h1{font-size:clamp(30px,6vw,60px);line-height:1.1;margin:.3em 0 .2em;letter-spacing:-.02em}
.sub{color:var(--mu);font-size:18px}
.cta{background:var(--gold);color:#111;padding:12px 22px;border-radius:8px;font-weight:700;min-height:44px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}
.chip{padding:8px 14px;border:1px solid var(--ln);border-radius:20px;color:var(--mu);min-height:40px}
.chip.on{border-color:var(--gold);color:var(--gold)}
.hero{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.info{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:18px;position:sticky;top:70px}
.info .y{font-size:40px;color:var(--gold)}
.tl{display:flex;overflow-x:auto;padding:30px 10px 20px;position:relative;scroll-behavior:smooth}
.tl::before{content:"";position:absolute;left:0;right:0;top:56px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.n{flex:0 0 130px;text-align:center;position:relative;padding:0 4px}
.n i{display:block;width:12px;height:12px;border-radius:50%;background:var(--card2);border:2px solid var(--gold);margin:0 auto 10px;position:relative;transition:.3s}
.n.big i{width:20px;height:20px;margin-top:-4px;box-shadow:0 0 14px var(--gold)}
.n.sel i{background:var(--gold);box-shadow:0 0 22px var(--blue);transform:scale(1.3)}
.n.seen i{border-color:var(--blue)}
.n b{display:block;font-size:12px;color:var(--gold);font-weight:400}
.n span{font-size:14px}
.n:after{content:"›";position:absolute;right:-6px;top:44px;color:var(--mu)}
.n:last-child:after{content:""}
.drawer{position:fixed;inset:0;background:#000b;display:none;z-index:20;justify-content:flex-end}
.drawer.on{display:flex}
.panel{width:min(620px,100%);background:var(--card);height:100%;overflow:auto;padding:24px 20px calc(40px + env(safe-area-inset-bottom,0px));animation:sl .3s}
@keyframes sl{from{transform:translateX(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.panel h2{font-size:30px;margin:.2em 0}
.sec{border-left:2px solid var(--gold);padding-left:14px;margin:18px 0}
.sec h3{margin:0 0 6px;font-size:16px;color:var(--gold)}
.sec li{margin:3px 0}
.tag{display:inline-block;color:var(--blue);margin-right:8px;font-size:14px}
.rel{display:flex;flex-wrap:wrap;gap:8px}
.rel button,.pbtn{border:1px solid var(--ln);border-radius:8px;padding:8px 12px;background:var(--card2);min-height:44px;text-align:left}
.rel small{color:var(--gold);display:block;font-size:11px}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.flow span.cur{background:var(--gold);color:#111;padding:6px 10px;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.box{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp .box:first-child{border-top:3px solid var(--no)}.cmp .box:last-child{border-top:3px solid var(--blue)}
.cmp dt{color:var(--gold);font-size:13px;margin-top:10px}.cmp dd{margin:0}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:1px solid var(--ln);border-radius:10px;background:var(--card2);min-height:48px}
.opt.ok{border-color:var(--ok);background:#12301f}.opt.no{border-color:var(--no);background:#3a1717}
.bar{height:10px;background:var(--card2);border-radius:5px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));transition:.5s}
svg text{fill:var(--tx);font-size:12px;font-family:sans-serif}
.rt{cursor:pointer;fill:none;stroke-width:3;stroke-dasharray:7 5}.rt:hover,.rt.on{stroke-width:5}
@media(max-width:760px){
.hero,.cmp{grid-template-columns:1fr}.info{position:static;order:-1}
.tl{flex-direction:column;overflow:visible;padding:10px 0 10px 24px}
.tl::before{left:11px;right:auto;top:0;bottom:0;width:1px;height:auto;background:var(--gold)}
.n{flex:none;text-align:left;padding:10px 0 10px 20px;min-height:56px;width:100%}
.n i{position:absolute;left:-19px;top:20px;margin:0}.n.big i{margin:0;left:-23px;top:16px}
.n:after{content:""}}
.tl{flex-direction:column;overflow:visible;padding:10px 0 10px 24px}
.tl::before{left:11px;right:auto;top:0;bottom:0;width:1px;height:auto;background:linear-gradient(var(--gold),var(--blue))}
.n{flex:none;text-align:left;padding:12px 0 12px 22px;width:100%;min-height:56px;display:block}
.n i{position:absolute;left:-19px;top:22px;margin:0}.n.big i{margin:0;left:-23px;top:18px}
.n:after{content:""}.n span{font-size:17px}.n small{display:block;color:var(--mu);font-size:13px}
.di{padding:12px;margin:6px 0;border:1px solid var(--ln);border-radius:10px;background:var(--card2);touch-action:none;cursor:grab;user-select:none;min-height:48px}
.di.drg{border-color:var(--gold);opacity:.8}.di.ok{border-color:var(--ok)}.di.no{border-color:var(--no)}
:root{--bg:#f4f7ff;--card:#fff;--card2:#eaf0ff;--tx:#26304a;--mu:#66728f;--gold:#f97316;--blue:#3b82f6;--ok:#16a34a;--no:#ef4444;--ln:#d6e0f7}
body,.n span,.panel{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}
nav{background:#f4f7ffee}
.drawer{background:#1e2a4a88}
.cta{color:#fff;border-radius:999px;box-shadow:0 3px 0 #c2570d}
.cta:active{transform:translateY(2px);box-shadow:none}
.box,.info,.panel .rel button,.pbtn,.opt,.di{border-radius:16px}
.box,.info{box-shadow:0 2px 8px #3b82f622}
.chip,nav button{border-radius:999px}
.chip.on,nav button.on{background:#fff2e6}
.flow span.cur{color:#fff;border-radius:999px}
.opt.ok{background:#dcfce7}.opt.no{background:#fee2e2}
.n.big i{box-shadow:0 0 0 5px #f9731633}.n.sel i{box-shadow:0 0 0 6px #3b82f644}
svg polygon{fill:#bcd3f7}svg g circle{stroke:#26304a;stroke-width:1.5}
h1{letter-spacing:0}
.cd{text-align:left}.cd p{display:none;margin:6px 0 0;font-size:14px}.cd.open p{display:block}.cd.open{border-color:var(--gold)}
</style></head><body>
<nav id="nav"></nav>
